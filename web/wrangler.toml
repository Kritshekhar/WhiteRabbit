# The White Rabbit site on whiterabbitai.org: the built pages in dist/ served
# as static assets by Cloudflare (free and not metered). Deployed by
# .github/workflows/deploy.yml after every build.
name = "whiterabbit-site"
compatibility_date = "2026-09-01"

routes = [{ pattern = "whiterabbitai.org", custom_domain = true }]

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
