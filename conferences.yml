# ---------------------------------------------------------------------------
# Conference deadline tracker - single source of truth.
#
# Add a venue by appending an entry to `venues:`. The ONLY required field is
# `name`; everything else is optional and the build script fills in defaults.
# A new entry shows up on the dashboard on the next build (push or nightly).
#
# Fields
#   name        (required) short label shown on the card, e.g. "OSDI"
#   full_name   long name, shown under the label
#   tier        Where a venue sits on a project's path to completion:
#                 rabbit-hole    stage 1 - workshops, the early idea
#                 royal-flush    stage 2 - the strongest full-paper venues
#                 full-house     stage 2 - strong specialised full-paper venues
#                 looking-glass  stage 3 - journals, the archival version
#               (default: full-house). See journey.html.
#   url         current homepage for the cycle below
#   url_template  homepage pattern used to roll the link over to the next
#                 cycle automatically. Placeholders:
#                   {year} -> 2027      {yy} -> 27      {yyn} -> 28 (year+1)
#                 Omit it to opt out of auto-rollover (link stays as-is).
#   year        the edition `url` points at (the "cycle year")
#   month       typical month the conference is held (1-12), used for sorting
#               hints only
#   formats     list of paper formats the venue accepts, e.g.
#                 [Full paper, Short paper, Poster] - rendered as "Accepts" tags
#   tracks      list of tracks, e.g. [Research, Industry] - rendered as tags
#   deadlines   list of { name, date, confirmed, track }
#                 track      optional, e.g. Research / Industry. Shown as a tag
#                            beside that deadline, for venues whose tracks
#                            close on different days.
#                 date       ISO 8601. Use -12:00 for AoE (anywhere on Earth).
#                            null / omitted  ->  rendered as "TBA"
#                 confirmed  true once you have verified it on the CFP page.
#                            false renders an "est." badge on the dashboard.
#   cycle_years how many years between editions (default 1). Set 2 for biennial
#               venues such as HotOS, so rollover steps 2025 -> 2027, not 2026.
#   rolling     true for journals / continuous submission (no countdown)
#   notes       free text shown on the card
#
# Rollover: once every deadline in a cycle has passed (plus `grace_days` from
# settings), the updater probes url_template for year+1. If that page is live
# it bumps `year`, rewrites `url`, shifts the deadlines forward by one year and
# flips them back to `confirmed: false`. Nothing is lost if the page is not up
# yet - it just retries the next night.
# ---------------------------------------------------------------------------

settings:
  # Days after the last deadline of a cycle before we start probing next year.
  grace_days: 21
  # Default timezone note rendered next to dates that use the -12:00 offset.
  aoe_label: "AoE"

