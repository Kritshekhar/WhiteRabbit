# ---------------------------------------------------------------------------
# Funding deadlines: grants, fellowships and research awards in computer
# science. Companion to conferences.yml, same rules.
#
#   name         required
#   funder       NSF, DARPA, Google, ... shown as a tag
#   eligibility  who may apply. Drives the main filter on the page:
#                  PhD student | Postdoc | Faculty / PI | Early-career faculty
#   url          the programme page
#   amount       free text, e.g. "$500k over 3 years"
#   topics       subject tags
#   deadlines    [{ name, date, confirmed, source }]
#   notes        anything a reader needs before clicking
#
# The verified / estimated rule is the same as the conference list: a date is
# `confirmed: true` only when a human read it on the funder's own page, and
# then `source` must point there. Everything else wears an "est." badge.
#
# Federal programmes are imported by scripts/import_grants.py from the
# grants.gov API. The fellowships below have no API anywhere and are
# maintained by hand.
# ---------------------------------------------------------------------------

settings:
  grace_days: 14

grants:
  # ------------------------- PhD student fellowships ------------------------
  - name: NSF Graduate Research Fellowship (GRFP)
    funder: NSF
    eligibility: PhD student
    url: https://www.nsfgrfp.org/
    amount: $37k/yr stipend for 3 years, plus tuition
    topics: [General]
    notes: Applies to first- and second-year PhD students and seniors. The computer and information sciences deadline is usually the third week of October.
    deadlines:
      - name: Application
        date:
        confirmed: false

