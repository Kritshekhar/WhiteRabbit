name: White Rabbit - weekly funding sweep

# Every Monday, re-query grants.gov for CS funding across NSF, NIH, DoD, DOE and
# NASA, pull the new solicitations, verify their dates against the agencies' own
# records, and open a pull request with whatever is new.
#
# A pull request, not a commit. The importer assigns an ACM CCS class from the
# programme title, which agrees with a read-the-solicitation classification about
# 80% of the time and declines rather than guesses on the rest. That is a good
# starting point and a bad thing to publish unreviewed, so a person sees the diff.

on:
  schedule:
    - cron: "0 9 * * 1"     # Mondays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: funding-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Import new opportunities
        id: sweep
        run: |
          python scripts/import_grants.py --write | tee /tmp/import.log
          python scripts/enrich_grants.py --write | tee /tmp/enrich.log
          python scripts/verify_grants.py --write | tee /tmp/verify.log
          python scripts/db.py check
          python scripts/update_grants.py

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet db/whiterabbit.sql; then
            echo "no new funding opportunities this week"
            exit 0
          fi
          ADDED=$(python -c "import sys; sys.path.insert(0, 'scripts'); import db; print(db.connect().execute('SELECT count(*) FROM grants').fetchone()[0])")
          BRANCH="funding-sweep/$(date -u +%Y-%m-%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add db/whiterabbit.sql data/grants.json
          git commit -m "chore: weekly funding sweep ($(date -u +%Y-%m-%d))"
          git push -u origin "$BRANCH"
          {
            echo "Automated sweep of grants.gov across NSF, NIH, DoD, DOE and NASA."
            echo
            echo "\`\`\`"
            cat /tmp/import.log /tmp/verify.log
            echo "\`\`\`"
            echo
            echo "**Review before merging.** New entries carry \`ccs_auto = 1\`:"
            echo "their ACM class was assigned from the title, not by reading the"
            echo "solicitation. Correct any with \`python scripts/wr.py set <id> ccs ...\`"
            echo "and clear the flag with \`python scripts/wr.py set <id> ccs_auto 0\`."
            echo
            echo "$ADDED programmes tracked after this sweep."
          } > /tmp/body.md
          gh pr create --base main --head "$BRANCH" \
            --title "Weekly funding sweep - $(date -u +%Y-%m-%d)" --body-file /tmp/body.md
