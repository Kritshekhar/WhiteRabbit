name: White Rabbit - refresh deadlines

on:
  schedule:
    # Nightly: 07:00 UTC = midnight Arizona (UTC-7, no DST) - i.e. end of each
    # day. Probes only venues that plausibly moved (see --scope auto).
    - cron: "0 7 * * *"
    # Monthly: re-probe every venue on the 1st, so nothing drifts unnoticed.
    - cron: "0 6 1 * *"
  push:
    branches: [main]
    paths:
      - conferences.yml
      - scripts/**
      - .github/workflows/update-deadlines.yml
  workflow_dispatch:
    inputs:
      scope:
        description: "auto = only venues that plausibly moved; all = re-probe everything"
        type: choice
        default: auto
        options: [auto, all]

permissions:
  contents: write   # commit the regenerated data file / year rollovers

concurrency:
  group: refresh-deadlines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Validate conferences.yml
        run: python scripts/validate_config.py

      - name: Rebuild dashboard data
        run: |
          # The monthly cron forces a full sweep; the nightly one does not.
          SCOPE=auto
          if [ "${{ github.event.schedule }}" = "0 6 1 * *" ]; then SCOPE=all; fi
          if [ "${{ inputs.scope }}" = "all" ]; then SCOPE=all; fi
          echo "probe scope: $SCOPE"
          python scripts/update.py --scope "$SCOPE"

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deadlines.json conferences.yml index.html journey.html
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh deadlines ($(date -u +%Y-%m-%d))"
            git push
          fi
