name: White Rabbit - refresh deadlines

on:
  schedule:
    # Nightly: 07:00 UTC = midnight Arizona (UTC-7, no DST) - i.e. end of each
    # day. Probes only venues that plausibly moved (see --scope auto).
    - cron: "0 7 * * *"
    # Monthly: re-probe every venue on the 1st, so nothing drifts unnoticed.
    - cron: "0 6 1 * *"
  push:
    branches: [main]
    paths:
      - db/**
      - scripts/**
      - .github/workflows/update-deadlines.yml
  workflow_dispatch:
    inputs:
      scope:
        description: "auto = only venues that plausibly moved; all = re-probe everything"
        type: choice
        default: auto
        options: [auto, all]

permissions:
  contents: write   # commit the refreshed database dump and data files

concurrency:
  group: refresh-deadlines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Validate the database
        run: python scripts/db.py check

      # Exact-date match on each venue's own CFP page; a different date is only
      # queued for review, never written. Chrome on the runner renders
      # JavaScript-only pages.
      - name: Verify deadlines against official pages
        run: python scripts/verify_deadlines.py --write --render --jina

      # fellowship calls publish dates only while open; pick them up from the
      # programmes' own pages (one clear upcoming deadline, or queued)
      - name: Find fellowship deadlines
        run: python scripts/fellowship_dates.py --write --render --jina

      - name: Rebuild funding data
        run: python scripts/update_grants.py

      - name: Rebuild dashboard data
        run: |
          # The monthly cron forces a full sweep; the nightly one does not.
          SCOPE=auto
          if [ "${{ github.event.schedule }}" = "0 6 1 * *" ]; then SCOPE=all; fi
          if [ "${{ inputs.scope }}" = "all" ]; then SCOPE=all; fi
          echo "probe scope: $SCOPE"
          python scripts/update.py --scope "$SCOPE"

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/whiterabbit.sql
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh deadlines ($(date -u +%Y-%m-%d))"
            git push
          fi
