name: White Rabbit — update & deploy

on:
  schedule:
    # 07:00 UTC = midnight Arizona (UTC-7, no DST) - i.e. end of each day.
    - cron: "0 7 * * *"
  push:
    branches: [main]
    paths:
      - conferences.yml
      - scripts/**
      - assets/**
      - index.html
      - .github/workflows/update-deadlines.yml
  workflow_dispatch:

permissions:
  contents: write   # commit the regenerated data file / year rollovers
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild dashboard data
        run: python scripts/update.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deadlines.json conferences.yml
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh deadlines ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on via the API instead of requiring a manual visit to
          # Settings -> Pages. Needs the repo to be public, or a plan that
          # allows Pages on private repos.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
