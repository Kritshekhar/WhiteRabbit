name: White Rabbit — refresh deadlines

on:
  schedule:
    # 07:00 UTC = midnight Arizona (UTC-7, no DST) - i.e. end of each day.
    - cron: "0 7 * * *"
  push:
    branches: [main]
    paths:
      - conferences.yml
      - scripts/**
      - .github/workflows/update-deadlines.yml
  workflow_dispatch:

permissions:
  contents: write   # commit the regenerated data file / year rollovers

concurrency:
  group: refresh-deadlines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Validate conferences.yml
        run: python scripts/validate_config.py

      - name: Rebuild dashboard data
        run: python scripts/update.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deadlines.json conferences.yml
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh deadlines ($(date -u +%Y-%m-%d))"
            git push
          fi
