name: White Rabbit - deploy to Pages

# Split from the refresh workflow on purpose: the data rebuild must stay green
# and visible even when publishing is blocked (a private repo on a plan without
# Pages fails here, and that should not look like a broken build).
#
# The site is built by Astro (web/) from the database, which is rebuilt from
# the dump in the private data repository first. Every page is static;
# countdowns run in the browser.
#
# Requires, one time:
#   Settings -> Pages -> Source: GitHub Actions

on:
  push:
    branches: [main]
  # The data is refreshed in the private data repository (deadlines 07:00 UTC,
  # proceedings 05:00 UTC), which cannot start a run here, so the site is
  # rebuilt on a schedule after those jobs.
  schedule:
    - cron: "30 9 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the database is private (Kritshekhar/WhiteRabbit-data), read with a read-only deploy key
      - name: Check out the data
        uses: actions/checkout@v4
        with:
          repository: Kritshekhar/WhiteRabbit-data
          path: data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the database from the dump
        run: python scripts/db.py build

      - name: Build the site
        working-directory: web
        env:
          # the chat assistant's address (chat/); without it the chat button is left out
          PUBLIC_CHAT_URL: ${{ vars.CHAT_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          npm ci
          npm run build
          npm run smoke

      # what the chat assistant knows, refreshed with every build; it goes to
      # the Worker's private store, never into the published site
      - name: Refresh the chat assistant's knowledge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no CLOUDFLARE_API_TOKEN, skipped"; exit 0; fi
          python scripts/chat_knowledge.py > chat/knowledge.json
          cd chat && npx --yes wrangler@4 kv key put knowledge --path knowledge.json --binding KNOWLEDGE --remote

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
