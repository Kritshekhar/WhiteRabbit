name: Validate data

on:
  pull_request:
    paths:
      - db/**
      - scripts/**
      - tests/**
      - web/**
      - requirements*.txt
      - .github/workflows/validate.yml
  push:
    branches: [main]
    paths:
      - db/**
      - scripts/**
      - tests/**
      - web/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the database is private (Kritshekhar/WhiteRabbit-data), read with a read-only deploy key
      - name: Check out the data
        uses: actions/checkout@v4
        with:
          repository: Kritshekhar/WhiteRabbit-data
          path: data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate the database
        run: python scripts/db.py check

      - name: The dump must be canonical (as scripts/db.py dump writes it)
        run: |
          python scripts/db.py build
          python scripts/db.py dump
          git -C data diff --exit-code whiterabbit.sql

      - name: Build must succeed offline
        run: |
          python scripts/update.py --no-network
          python scripts/update_grants.py --no-network

      - name: Tests
        run: python -m pytest -q tests

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the data
        uses: actions/checkout@v4
        with:
          repository: Kritshekhar/WhiteRabbit-data
          path: data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the database from the dump
        run: python scripts/db.py build

      - name: Unit tests, type check, build and smoke test
        working-directory: web
        run: |
          npm ci
          npm test
          npm run check
          npm run build
          npm run smoke
