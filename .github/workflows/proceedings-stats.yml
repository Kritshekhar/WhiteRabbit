name: White Rabbit - proceedings stats

# Daily: count each venue's papers per year from the DBLP dump and backfill
# topic breakdowns from OpenAlex, then commit the aggregates.
#
# The 1.1 GB DBLP dump and the parsed paper list (cache/) live in the Actions
# cache, never in git. The dump is re-downloaded monthly; on other days the run
# reuses it and only spends OpenAlex's daily request budget on topics. Finished
# years are verified and never recomputed, so after the first backfill a run
# touches little more than the current year.

on:
  schedule:
    - cron: "0 5 * * *"    # daily, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proceedings-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Month stamp
        id: month
        run: echo "stamp=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore DBLP cache
        uses: actions/cache@v4
        with:
          path: cache
          # one entry per month: saved after the month's first run, which
          # downloads and parses; later runs that month restore it untouched
          key: dblp-${{ steps.month.outputs.stamp }}
          restore-keys: dblp-

      - name: Count papers from DBLP
        run: python scripts/proceedings_dblp.py

      - name: Backfill topics from OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/proceedings_openalex.py

      # official acceptance figures from the venues' own published messages;
      # anything ambiguous is queued for review, never guessed
      - name: Acceptance rates from official sources
        run: python scripts/acceptance_rates.py --write

      - name: Validate
        run: python scripts/db.py check

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/whiterabbit.sql
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh proceedings stats ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
